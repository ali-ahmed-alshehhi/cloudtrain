# Alert rules (the guide's stretch goal: SLO alerting). Shown in Prometheus at /alerts and on the dashboard.
# The same alarms on AWS are CloudWatch alarms (infrastructure/modules/monitoring, Hamda + Fatma, #109).
# Tested with: promtool test rules monitoring/prometheus/alerts.test.yml
groups:
  - name: cloudtrain
    rules:
      - alert: CloudTrainServiceDown
        expr: up{job="cloudtrain"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus could not read {{ $labels.service }}/metrics for 1 minute."

      - alert: CloudTrainHighErrorRate
        # More than 5% of answers are 5xx over 5 minutes, with at least some traffic.
        expr: |
          sum by (service) (rate({__name__=~".+_requests_total", status=~"5.."}[5m]))
            / sum by (service) (rate({__name__=~".+_requests_total"}[5m])) > 0.05
          and sum by (service) (rate({__name__=~".+_requests_total"}[5m])) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} answers more than 5% errors"

      - alert: CloudTrainDeadLetters
        # A training job message gave up after its retries (job-service watches the dead-letter queue).
        expr: sum(increase(job_service_dead_letters_total[10m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A training job reached the dead-letter queue in the last 10 minutes"

      - alert: CloudTrainOutboxBacklog
        # Job events written but not yet sent to SQS.
        expr: job_service_outbox_pending > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} job events are waiting in the job-service outbox"

      - alert: CloudTrainJobEventsNotRead
        # The only reader of job-events has not read the queue for 2 minutes.
        expr: time() - cloudtrain_job_events_last_poll_timestamp_seconds > 120
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "job-events-monitor has not read the job-events queue for over 2 minutes"
