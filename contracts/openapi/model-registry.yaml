openapi: 3.1.0
info:
  title: CloudTrain Model Registry service
  version: 1.0.0
  description: |
    Owner: Majed (Student 8). Port 8006. Registers models from MLflow runs, promotes and rolls back versions.
    Public through the gateway at /api/v1/models/* (the gateway strips /api/v1).
    Backed by the MLflow Model Registry (mlflow:5000) plus its own `registry` schema
    (deployments, which version is live, rollback history).

    Internal: Inference calls `GET /models/{model_id}/production` to know which version to load.
    A new version must pass the inference `/health` check before it takes traffic; a failed
    deployment never replaces the healthy one.
servers:
  - url: http://model-registry:8006

paths:
  /models:
    post:
      operationId: registerModel
      summary: Register a model version from an MLflow run, linked to its job and dataset version.
      description: The first registration under a name creates the model and version 1; later ones add versions.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelRegister" }
      responses:
        "201":
          description: The new model version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listModels
      summary: List models (optionally of one project).
      parameters:
        - name: project_id
          in: query
          required: false
          schema: { type: string, pattern: "^project-[0-9]+$" }
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /models/{model_id}/versions:
    get:
      operationId: listModelVersions
      summary: All versions of one model.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Versions, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /models/{model_id}/production:
    get:
      operationId: getProductionVersion
      summary: The version currently serving, and where its files are. Used by Inference.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The live version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Production" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /models/{model_id}/versions/{version}/promote:
    post:
      operationId: promoteVersion
      summary: Make this version the live one.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The new live version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Production" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /models/{model_id}/rollback:
    post:
      operationId: rollback
      summary: Go back to the previous live version.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The live version after the rollback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Production" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /health:
    get:
      operationId: health
      summary: 200 when ready to serve.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics.
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: Set by the gateway after it verifies the login token.
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    ModelId:
      name: model_id
      in: path
      required: true
      schema: { type: string, pattern: "^model-[0-9]+$" }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    ModelRegister:
      type: object
      additionalProperties: false
      required: [project_id, name, mlflow_run_id, job_id, dataset_id, dataset_version]
      properties:
        project_id: { type: string, pattern: "^project-[0-9]+$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        mlflow_run_id: { type: string, minLength: 1, maxLength: 64 }
        job_id: { type: string, pattern: "^job-[0-9]+$" }
        dataset_id: { type: string, pattern: "^dataset-[0-9]+$" }
        dataset_version: { type: integer, minimum: 1 }
    ModelVersion:
      type: object
      required: [model_id, name, version, mlflow_run_id, job_id, dataset_id, dataset_version, metrics, stage, artifact_uri, created_at]
      properties:
        model_id: { type: string, pattern: "^model-[0-9]+$" }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        mlflow_run_id: { type: string }
        job_id: { type: string, pattern: "^job-[0-9]+$" }
        dataset_id: { type: string, pattern: "^dataset-[0-9]+$" }
        dataset_version: { type: integer, minimum: 1 }
        metrics:
          type: object
          description: 'Final metrics read from the MLflow run, e.g. {"accuracy": 0.91}'
          additionalProperties: { type: number }
        stage: { type: string, enum: [none, production, archived] }
        artifact_uri: { type: string, description: "e.g. s3://artifacts/model-03/v1/" }
        created_at: { type: string, format: date-time }
    ModelVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModelVersion" }
    Model:
      type: object
      required: [model_id, name, project_id, latest_version, production_version, created_at]
      properties:
        model_id: { type: string, pattern: "^model-[0-9]+$" }
        name: { type: string }
        project_id: { type: string, pattern: "^project-[0-9]+$" }
        latest_version: { type: integer, minimum: 1 }
        production_version: { type: [integer, "null"], minimum: 1 }
        created_at: { type: string, format: date-time }
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    Production:
      type: object
      required: [model_id, name, version, mlflow_run_id, artifact_uri, promoted_at]
      properties:
        model_id: { type: string, pattern: "^model-[0-9]+$" }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        mlflow_run_id: { type: string }
        artifact_uri: { type: string }
        promoted_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
    Error:
      description: Shared error format (contracts/error-format.json).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
            message: { type: string }
            request_id: { type: string }

  responses:
    BadRequest:
      description: Bad input (e.g. the MLflow run does not exist).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Not logged in.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Not a member of the project.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found (or no live version yet).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Duplicate, or nothing to roll back to.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: The request does not match the contract.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: MLflow or the new inference version is not healthy.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
