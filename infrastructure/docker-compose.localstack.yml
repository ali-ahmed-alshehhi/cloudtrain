# LocalStack for Terraform practice (Student 6 only).
# Does not replace the app LocalStack in the root docker-compose.yml (Ali).
# Use this when you want `terraform apply` from your laptop against fake AWS.
#
#   cd infrastructure
#   docker compose -f docker-compose.localstack.yml up -d
#   terraform init -backend=false
#   terraform apply -var-file=environments/dev/localstack.tfvars.example

services:
  localstack:
    image: localstack/localstack:4.14
    ports:
      # Host 4568 avoids clashing with other LocalStack labs on 4566
      - "4568:4566"
    environment:
      SERVICES: s3,sqs,ec2,ecr,iam,sts
      DEBUG: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
