openapi: 3.1.0
info:
  title: CloudTrain Training Jobs service
  version: 1.0.0
  description: |
    Owner: Mariam (Student 3). Port 8003. Job submission, lifecycle, events, alert feed and cost.
    Public through the gateway at /api/v1/jobs/* (the gateway strips /api/v1).

    - `POST /jobs` answers **202** at once and puts the full form (contracts/training-job.schema.json)
      on the `training-jobs` queue. Training happens later.
    - Every status change is stored in the job's history, stored as an event (for the alert feed)
      and published to the `job-events` queue (contracts/events/job-event.schema.json).
    - Status steps: contracts/job-states.md.

    Internal (never through the gateway): the Scheduler and the worker report status and heartbeats.
    If a report arrives for a job that was cancelled, the answer is 409 and the reporter stops the work.
servers:
  - url: http://job-service:8003

paths:
  /jobs:
    post:
      operationId: submitJob
      summary: Submit a training job. Answers 202 with the job in QUEUED.
      description: Checks the form, confirms the dataset version exists (Datasets service), saves the job, queues it.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSubmission" }
      responses:
        "202":
          description: Accepted and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listJobs
      summary: List the jobs of one project.
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string, pattern: "^project-[0-9]+$" }
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The project's jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /jobs/events:
    get:
      operationId: listRecentEvents
      summary: The alert feed. Recent events across the caller's projects, newest last.
      description: |
        The portal calls this every 5-10 seconds with back-off, passing the last event_id it has seen as `after`.
      parameters:
        - name: after
          in: query
          required: false
          description: Only events after this one.
          schema: { type: string, pattern: "^event-[0-9]+$" }
        - name: project_id
          in: query
          required: false
          description: "Only this project (default: all of the caller's projects)."
          schema: { type: string, pattern: "^project-[0-9]+$" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Events, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /jobs/{job_id}:
    get:
      operationId: getJob
      summary: Read one job, with status, history, machine type, GPU-hours and estimated cost.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a QUEUED, SCHEDULED or RUNNING job.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The job, now CANCELLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /jobs/{job_id}/events:
    get:
      operationId: listJobEvents
      summary: All events of one job, oldest first.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The job's events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /internal/jobs/{job_id}/status:
    post:
      operationId: reportStatus
      summary: INTERNAL (Scheduler, worker). Report SCHEDULED, RUNNING, SUCCEEDED or FAILED.
      description: 409 if the step is not allowed (for example the job was cancelled); the reporter then stops the work.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusReport" }
      responses:
        "200":
          description: The job after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /internal/jobs/{job_id}/heartbeat:
    post:
      operationId: heartbeat
      summary: INTERNAL (worker). "I am still alive", every HEARTBEAT_INTERVAL_SECONDS.
      description: The answer carries the job's current status. If it is CANCELLED, the worker stops.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Heartbeat" }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /health:
    get:
      operationId: health
      summary: 200 when ready to serve.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics.
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: Set by the gateway after it verifies the login token.
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, pattern: "^job-[0-9]+$" }

  schemas:
    JobSubmission:
      description: |
        The training job form WITHOUT job_id. Must stay identical to contracts/training-job.schema.json
        (minus job_id). For strategy "ddp", world_size must equal resources.gpu_count (checked in code; 422 if not).
      type: object
      additionalProperties: false
      required: [project_id, dataset_id, dataset_version, model, hyperparameters, resources, parallelism, execution]
      properties:
        project_id: { type: string, pattern: "^project-[0-9]+$" }
        dataset_id: { type: string, pattern: "^dataset-[0-9]+$" }
        dataset_version: { type: integer, minimum: 1 }
        model: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
        hyperparameters:
          type: object
          required: [epochs, batch_size, learning_rate]
          properties:
            epochs: { type: integer, minimum: 1, maximum: 1000 }
            batch_size: { type: integer, minimum: 1, maximum: 4096 }
            learning_rate: { type: number, exclusiveMinimum: 0, maximum: 10 }
          additionalProperties: { type: [number, integer, string, boolean] }
        resources:
          type: object
          additionalProperties: false
          required: [gpu_count, cpu_cores, memory_gb]
          properties:
            gpu_count: { type: integer, minimum: 0, maximum: 8 }
            cpu_cores: { type: integer, minimum: 1, maximum: 96 }
            memory_gb: { type: integer, minimum: 1, maximum: 768 }
        parallelism:
          type: object
          additionalProperties: false
          required: [strategy, world_size]
          properties:
            strategy: { type: string, enum: [single, ddp] }
            world_size: { type: integer, minimum: 1, maximum: 8 }
          allOf:
            - if: { properties: { strategy: { const: single } } }
              then: { properties: { world_size: { const: 1 } } }
            - if: { properties: { strategy: { const: ddp } } }
              then: { properties: { world_size: { minimum: 2 } } }
        execution:
          type: object
          additionalProperties: false
          required: [max_runtime_minutes, retry_limit]
          properties:
            max_runtime_minutes: { type: integer, minimum: 1, maximum: 1440 }
            retry_limit: { type: integer, minimum: 0, maximum: 5 }
      examples:
        - project_id: project-01
          dataset_id: dataset-07
          dataset_version: 2
          model: resnet18
          hyperparameters: { epochs: 10, batch_size: 32, learning_rate: 0.001 }
          resources: { gpu_count: 2, cpu_cores: 8, memory_gb: 32 }
          parallelism: { strategy: ddp, world_size: 2 }
          execution: { max_runtime_minutes: 120, retry_limit: 2 }
    JobStatus:
      type: string
      enum: [QUEUED, SCHEDULED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    StatusChange:
      type: object
      required: [status, at, reason]
      properties:
        status: { $ref: "#/components/schemas/JobStatus" }
        at: { type: string, format: date-time }
        reason: { type: [string, "null"] }
    Job:
      type: object
      required: [job_id, project_id, status, spec, machine_type, attempt, created_at, updated_at, started_at, finished_at, gpu_hours, estimated_cost_usd, history]
      properties:
        job_id: { type: string, pattern: "^job-[0-9]+$" }
        project_id: { type: string, pattern: "^project-[0-9]+$" }
        status: { $ref: "#/components/schemas/JobStatus" }
        spec:
          description: The submitted form (as in JobSubmission).
          type: object
        machine_type: { type: [string, "null"], description: "Set by the Scheduler, e.g. g4dn.xlarge" }
        attempt: { type: integer, minimum: 1, description: "1 for the first run, +1 per retry" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        gpu_hours: { type: number, minimum: 0 }
        estimated_cost_usd: { type: number, minimum: 0 }
        history:
          type: array
          items: { $ref: "#/components/schemas/StatusChange" }
    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
    JobEvent:
      description: Same shape as contracts/events/job-event.schema.json.
      type: object
      required: [event_id, event_type, job_id, project_id, occurred_at, data]
      properties:
        event_id: { type: string, pattern: "^event-[0-9]+$" }
        event_type:
          type: string
          enum: [job.queued, job.scheduled, job.running, job.succeeded, job.failed, job.cancelled, job.retrying]
        job_id: { type: string, pattern: "^job-[0-9]+$" }
        project_id: { type: string, pattern: "^project-[0-9]+$" }
        occurred_at: { type: string, format: date-time }
        data: { type: object }
    EventList:
      type: object
      required: [items, last_event_id]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobEvent" }
        last_event_id:
          type: [string, "null"]
          description: Pass this as `after` next time. null when there are no events.
    StatusReport:
      type: object
      additionalProperties: false
      required: [status, reported_by]
      properties:
        status: { type: string, enum: [SCHEDULED, RUNNING, SUCCEEDED, FAILED] }
        reported_by: { type: string, enum: [scheduler, worker] }
        worker_id: { type: string, maxLength: 128 }
        machine_type: { type: string, maxLength: 64 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        reason: { type: string, maxLength: 1000 }
    Heartbeat:
      type: object
      additionalProperties: false
      required: [worker_id, sent_at]
      properties:
        worker_id: { type: string, minLength: 1, maxLength: 128 }
        sent_at: { type: string, format: date-time }
    HeartbeatAck:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, pattern: "^job-[0-9]+$" }
        status: { $ref: "#/components/schemas/JobStatus" }
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
    Error:
      description: Shared error format (contracts/error-format.json).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
            message: { type: string }
            request_id: { type: string }

  responses:
    BadRequest:
      description: Bad input.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Not logged in.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Not a member of the project.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found (job, or the dataset version named in the form).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Not allowed in the job's current status, or duplicate.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: The request does not match the contract.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: A dependency (Datasets service, queue, database) is down.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
