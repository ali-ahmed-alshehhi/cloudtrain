# Hourly price per machine type, used by Training Jobs to compute estimated_cost_usd.
#
# Real AWS on-demand prices (Linux, us-east-1), filled by Hamda + Fatma (Student 6).
# Check again before quoting them in the final report: AWS can change prices.
#
# Cost of a job = hourly_usd x hours the machine ran (start to end reported by the Scheduler).
# gpu_hours of a job = gpu_count x hours.
# Adding a machine type is a contract change only if the Scheduler or Training Jobs must handle it differently.

currency: USD
region: us-east-1
last_updated: 2026-11-17   # date the prices were copied from AWS

machine_types:
  local-cpu:               # the local Docker worker; free
    gpu_count: 0
    hourly_usd: 0.0
  c6i.2xlarge:             # CPU: 8 vCPU, 16 GB
    gpu_count: 0
    hourly_usd: 0.34
  g4dn.xlarge:             # 1x NVIDIA T4, 4 vCPU, 16 GB
    gpu_count: 1
    hourly_usd: 0.526
  g4dn.12xlarge:           # 4x NVIDIA T4, 48 vCPU, 192 GB
    gpu_count: 4
    hourly_usd: 3.912
  g4dn.metal:              # 8x NVIDIA T4, 96 vCPU, 384 GB (jobs asking for 5 to 8 GPUs)
    gpu_count: 8
    hourly_usd: 7.824
