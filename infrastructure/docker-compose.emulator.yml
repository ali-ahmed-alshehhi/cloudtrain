# Official AWS Emulator for Student 6 Terraform practice.
# Does NOT replace the app LocalStack in the root docker-compose.yml (Ali).
#
#   cd infrastructure
#   ./scripts/emulator-up.sh
#   source ./scripts/emulator-env.sh
#   terraform init
#   terraform apply -var-file=environments/dev/emulator.tfvars.example

services:
  aws-emulator:
    build:
      context: ./emulator
      dockerfile: Dockerfile
    image: cloudtrain-aws-emulator:local
    container_name: cloudtrain-aws-emulator
    ports:
      # Bind to localhost only (AWS Emulator security guidance)
      - "127.0.0.1:9297:9297"
    environment:
      HOME: /home/emulator
      EMULATOR_TELEMETRY: "off"
    volumes:
      # Credentials + CA cert written here for the host SDK/Terraform
      - ${HOME}/.aws/emulator:/home/emulator/.aws/emulator
    command: ["-p", "9297"]
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /home/emulator/.aws/emulator/9297/emulator_credentials && test -f /home/emulator/.aws/emulator/9297/ca.pem",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
