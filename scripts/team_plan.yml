# Everyone's dated plan and the hand-offs, as data. scripts/create_tasks.py turns each row into a
# GitHub issue. Source: the "Schedule" section of the master plan (also shown in TEAM_GUIDE.md).
# Owner: Ali. Students are referred to by their number in team.yml.

milestones: # GitHub milestones; an issue goes to the first one due on or after its own due date
  - { title: "Checkpoint 1", due: 2026-11-15, description: "Every service starts and answers /health" }
  - { title: "Checkpoint 2", due: 2026-11-20, description: "Project -> dataset -> job through the gateway; first cloud GPU run; real login" }
  - { title: "Checkpoint 3", due: 2026-11-24, description: "On AWS; DDP benchmark; inference with rollback; failure recovery; full flow in the portal" }
  - { title: "Ready", due: 2026-11-27, description: "Tests, docs, benchmarks, evaluation and final report; submitted" }

phases: # label for an issue, from its due date (the brief's phases, compressed)
  - { label: foundation, until: 2026-11-15 }
  - { label: core, until: 2026-11-20 }
  - { label: integration, until: 2026-11-24 }
  - { label: finish, until: 2026-11-28 }

# Folders and contract files to link from each student's issues.
links:
  1: { folders: [gateway, project-service, tests/integration], contracts: [contracts/openapi/gateway.yaml, contracts/openapi/project-service.yaml] }
  2: { folders: [dataset-service], contracts: [contracts/openapi/dataset-service.yaml] }
  3: { folders: [job-service], contracts: [contracts/openapi/job-service.yaml, contracts/training-job.schema.json, contracts/job-states.md, contracts/events/job-event.schema.json] }
  4: { folders: [training, mlflow], contracts: [contracts/openapi/training-worker.yaml, contracts/training-job.schema.json] }
  5: { folders: [training/distributed], contracts: [contracts/training-job.schema.json] }
  6: { folders: [infrastructure], contracts: [contracts/pricing.yaml, contracts/ports.md] }
  7: { folders: [scheduler], contracts: [contracts/openapi/scheduler.yaml, contracts/training-job.schema.json, contracts/job-states.md] }
  8: { folders: [model-registry, inference-service], contracts: [contracts/openapi/model-registry.yaml, contracts/openapi/inference-service.yaml] }
  9: { folders: [security, .github/workflows], contracts: [contracts/error-format.json] }
  10: { folders: [portal], contracts: [contracts/events/job-event.schema.json] }

