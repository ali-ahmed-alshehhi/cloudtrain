# Prometheus for the local CloudTrain stack (owners: Hilal + Adel, Student 10). Proposal: #109.
# Reads every service's GET /metrics every 15 s. Container names and ports: contracts/ports.md.
# Local only: on the AWS Emulator the dashboard is CloudWatch (decision 0011).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloudtrain
    static_configs:
      - targets: ["gateway:5810"]
        labels: { service: gateway }
      - targets: ["portal:3000"]
        labels: { service: portal }
      - targets: ["project-service:8001"]
        labels: { service: project-service }
      - targets: ["dataset-service:8002"]
        labels: { service: dataset-service }
      - targets: ["job-service:8003"]
        labels: { service: job-service }
      - targets: ["scheduler:8004"]
        labels: { service: scheduler }
      - targets: ["model-registry:8006"]
        labels: { service: model-registry }
      - targets: ["inference-service:8007"]
        labels: { service: inference-service }
      - targets: ["training-worker:8010"]
        labels: { service: training-worker }
      - targets: ["job-events-monitor:8011"]
        labels: { service: job-events-monitor }
