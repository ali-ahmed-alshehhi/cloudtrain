# Starter CI by Ali — Salem extends with scanning, security, staging deploy and approval.
#
# Runs on every pull request and on every push to main. A pull request can be merged only when
# this passes (see scripts/protect_main.sh). Steps:
#   1. lint and unit tests for the changed services
#   2. Docker build for the changed services
#   3. start everything (docker compose)
#   4. contract tests (make contract)
#   5. the end-to-end walk-through (make e2e)
#   6. if anything failed: upload all container logs
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: python # the Python 3.11 installed below
    steps:
      - name: Get the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to see which folders changed

      - name: Install Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Find the changed services
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          services=$(bash scripts/changed_services.sh "$base" | tr '\n' ' ')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Changed services: ${services:-none}"

      - name: 1. Lint and unit tests (changed services)
        env:
          SERVICES: ${{ steps.changed.outputs.services }}
        run: |
          make tools
          for service in $SERVICES; do
            echo "::group::$service"
            .venv/bin/ruff check "$service"
            .venv/bin/ruff format --check "$service"
            bash scripts/test_service.sh "$service"
            echo "::endgroup::"
          done

      - name: 2. Docker build (changed services)
        env:
          SERVICES: ${{ steps.changed.outputs.services }}
        run: |
          cp .env.example .env
          # folder name -> docker-compose name (only the training folder differs)
          read -ra names <<< "${SERVICES//training/training-worker}"
          if [ ${#names[@]} -gt 0 ]; then docker compose build "${names[@]}"; fi

      - name: 3. Start everything
        run: make up

      - name: 4. Contract tests
        run: make contract

      - name: 5. End-to-end walk-through
        run: make e2e

      - name: 6. Collect the logs (only when something failed)
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose ps --all > ci-logs/containers.txt 2>&1 || true
          docker compose logs --no-color > ci-logs/all-containers.log 2>&1 || true

      - name: Upload the logs (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 7

      - name: Stop everything
        if: always()
        run: docker compose down --volumes || true
