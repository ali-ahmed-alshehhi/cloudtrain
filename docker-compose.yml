# CloudTrain on one laptop: `make up` starts all of this, `make down` stops it.
# Owner: Ali. Changing this file needs Ali's approval (CODEOWNERS).
#
# Rules followed here (docs/ARCHITECTURE.md):
#   - only TWO ports reach the laptop: 5810 (gateway) and 3000 (portal)
#   - every container has a health check, and starts only after what it needs is healthy
#   - every setting comes from .env (copied from .env.example by `make up`)
# Container names are the addresses services use to call each other, e.g. http://job-service:8003.

name: cloudtrain

services:
  # ---------- Infrastructure (in the cloud: RDS, S3 and SQS, made by Terraform) ----------

  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data # kept until `make reset`
      - ./local/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack: # stands in for AWS S3 and SQS (docs/decisions/0005-localstack-for-s3.md)
    image: localstack/localstack:4.14 # pinned: newer LocalStack images may need an account
    env_file: .env
    environment:
      SERVICES: s3,sqs
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - ./local/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck: # healthy only after the buckets and queues exist
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  mlflow:
    build: ./mlflow
    env_file: .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT}
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 90s # the first start creates MLflow's tables
      retries: 30

  # ---------- CloudTrain services ----------

  project-service: # Ali
    build: ./project-service
    env_file: .env
    environment:
      DATABASE_URL: ${PROJECTS_DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  dataset-service: # Faisal
    build: ./dataset-service
    env_file: .env
    environment:
      DATABASE_URL: ${DATASETS_DATABASE_URL}
    depends_on:
      localstack: { condition: service_healthy }
      project-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  job-service: # Mariam
    build: ./job-service
    env_file: .env
    environment:
      DATABASE_URL: ${JOBS_DATABASE_URL}
    volumes:
      - ./contracts:/contracts:ro # contracts/pricing.yaml, for the cost of each job (PRICING_FILE)
    depends_on:
      localstack: { condition: service_healthy }
      project-service: { condition: service_healthy }
      dataset-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  training-worker: # Abdullah; DDP by Ahmed + Abdulla
    build: ./training
    env_file: .env
    depends_on:
      job-service: { condition: service_healthy }
      dataset-service: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  scheduler: # Maitha
    build: ./scheduler
    env_file: .env
    environment:
      DATABASE_URL: ${SCHEDULER_DATABASE_URL}
    depends_on:
      localstack: { condition: service_healthy }
      job-service: { condition: service_healthy }
      training-worker: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  model-registry: # Majed
    build: ./model-registry
    env_file: .env
    environment:
      DATABASE_URL: ${REGISTRY_DATABASE_URL}
    depends_on:
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  inference-service: # Majed
    build: ./inference-service
    env_file: .env
    depends_on:
      model-registry: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  # ---------- The two front doors ----------

  gateway: # Ali
    build: ./gateway
    env_file: .env
    ports:
      - "5810:5810"
    depends_on:
      project-service: { condition: service_healthy }
      dataset-service: { condition: service_healthy }
      job-service: { condition: service_healthy }
      mlflow: { condition: service_healthy }
      model-registry: { condition: service_healthy }
      inference-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5810/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  portal: # Hilal + Adel
    build: ./portal
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  # ---------- Tools (not started by `make up`; used by `make contract`) ----------

  contract-tests:
    profiles: [tools]
    build: ./tests/contract
    volumes:
      - ./contracts:/contracts:ro
    env_file: .env

volumes:
  postgres-data:
