name: Bug
description: Something does not work as the contract or plan says.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Which service or page
      placeholder: e.g. job-service, POST /jobs
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or clicks.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen (with the contract reference)
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens instead
      description: Paste the error, including its request_id.
    validations:
      required: true
