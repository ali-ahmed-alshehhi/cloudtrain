# Alembic = database migrations (step-by-step changes to the tables).
# The database address comes from the DATABASE_URL environment variable (see migrations/env.py).
[alembic]
script_location = migrations
# Lets migrations/env.py import our code (`from app.db import ...`).
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
